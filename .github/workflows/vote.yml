name: vote
on:
  # justo después de registrar un ganador (cuando winners.json ya está al día): si es antes de las 15:00, espera hasta entonces
  workflow_run:
    workflows: [winners]
    types: [completed]
  schedule:
    # red de seguridad, todos los días, cada hora de 13 a 19 UTC (15:00 Madrid cae a las 13 en verano y a las 14 en invierno):
    # por si el aviso no salió al registrar. El script decide si toca y no avisa dos veces.
    - cron: "0 13-19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Enviar la votación del último sorteo aunque no sea su día (no repite si ya se envió)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vote
  cancel-in-progress: false
jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # en workflow_run, el main de después de que winners.yml haya subido winners.json
      - run: node scripts/vote.js ${{ github.event_name == 'workflow_run' && '--wait' || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
      - run: |
          git config user.name "sweep-bot"
          git config user.email "sweep-bot@users.noreply.github.com"
          git add data/poll.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore: vote announced" && git pull --rebase -X theirs origin main && git push; }
