name: winners
on:
  issues:
    types: [opened, edited, closed, reopened, deleted]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: sweep
  cancel-in-progress: false
jobs:
  winners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/winners.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "sweep-bot"
          git config user.email "sweep-bot@users.noreply.github.com"
          git add data/winners.json
          git diff --cached --quiet || { git commit -m "chore: refresh winners" && git pull --rebase -X theirs origin main && git push; }
