<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe del inspector</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Archivo:wdth,wght@100..125,500..800&display=swap">
<style>
:root{
  --linen:#e9e1cf; --paper:#fbf7ee; --ink:#1f1b16; --ink-soft:#5d554a; --rule:#cfc4ad;
  --red:#b3121f; --red-ink:rgba(179,18,31,.85);
  --font-display:'Playfair Display',Georgia,serif; --font-body:'Source Serif 4',Georgia,serif; --font-label:'Archivo',"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--linen);color:var(--ink);font-family:var(--font-body);font-size:1.05rem;line-height:1.55}
.desk{max-width:42rem;margin:0 auto;padding:2.5rem 1rem 3rem}
.sheet{position:relative;background:var(--paper);padding:2.5rem 2.75rem 2rem;box-shadow:0 .1rem .2rem rgba(60,40,10,.12),0 1rem 2.5rem rgba(60,40,10,.14);overflow:hidden}
@media (max-width:34rem){.sheet{padding:1.75rem 1.25rem 1.5rem}}
.label{font-family:var(--font-label);font-variation-settings:"wdth" 118,"wght" 700;text-transform:uppercase;letter-spacing:.2em;font-size:.68rem}
.kicker{display:flex;justify-content:space-between;gap:1rem;margin:0;padding-bottom:.6rem;border-bottom:.2rem double var(--ink);color:var(--ink)}
.kicker .red{color:var(--red)}
h1{margin:1.6rem 0 .3rem;font-family:var(--font-display);font-style:italic;font-weight:700;font-size:clamp(2.1rem,7vw,3.2rem);line-height:1.05;text-wrap:balance}
.meta{margin:0;color:var(--ink-soft);font-style:italic}
.cred{margin:1.6rem 0 0;padding:1rem 0;border-top:.06rem solid var(--rule);border-bottom:.06rem solid var(--rule);display:grid;gap:.6rem;justify-items:start}
.cred p{margin:0;font-size:.95rem;color:var(--ink-soft)}
.cred .who{font-family:var(--font-label);font-size:.78rem;letter-spacing:.04em;color:var(--ink-soft)}
.cred:empty{display:none}
h2{margin:1.8rem 0 .4rem;color:var(--red)}

/* los cuatro distintivos */
.awards{list-style:none;margin:0;padding:0}
.awards li+li{border-top:.06rem solid var(--rule)}
.award{width:100%;display:grid;grid-template-columns:4.2rem 1fr auto;gap:.2rem 1rem;align-items:center;padding:1rem .6rem;margin:0;border:0;background:none;text-align:left;
  font:inherit;color:inherit;cursor:pointer;border-left:.2rem solid transparent;transition:background .15s,border-color .15s}
.award:hover:not([disabled]),.award:focus-visible{background:rgba(179,18,31,.05)}
.award:focus-visible{outline:.12rem solid var(--red);outline-offset:-.12rem}
.award[aria-pressed="true"]{border-left-color:var(--red);background:rgba(179,18,31,.07)}
.award[disabled]{cursor:default}
.award[disabled]:not([aria-pressed="true"]) .txt{opacity:.75}
.emb{font-size:1.35rem;letter-spacing:.08em;color:var(--red);text-align:center;line-height:1}
.emb.none{font-size:1.6rem}
.txt b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1.2}
.txt i{display:block;color:var(--ink-soft);font-size:.95rem}
.mine{display:inline-block;margin-left:.5rem;vertical-align:.2rem;color:var(--red)}
.tally{display:grid;justify-items:end;gap:.3rem;min-width:4.5rem}
.tally .n{font-family:var(--font-label);font-variation-settings:"wght" 700;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.tally .bar{width:4.5rem;height:.3rem;background:var(--rule);position:relative}
.tally .bar::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--red)}
.note{min-height:1.6rem;margin:0;font-style:italic;color:var(--ink-soft)}
.note b{font-style:normal;color:var(--ink)}
.note.err{color:var(--red)}

/* el sello de tinta del dictamen */
.verdict{display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center;margin-top:1.2rem}
.stamp{width:9rem;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;gap:.15rem;
  border:.2rem double var(--red-ink);color:var(--red-ink);transform:rotate(-14deg);mix-blend-mode:multiply;
  background:radial-gradient(circle,transparent 58%,rgba(179,18,31,.06) 60%);pointer-events:none}
.stamp[hidden]{display:none}
.stamp .s-emb{font-size:1.1rem;letter-spacing:.06em}
.stamp .s-txt{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:.95rem;line-height:1.05;padding:0 .6rem}
.stamp .s-lbl{font-size:.48rem;letter-spacing:.12em;line-height:1.3;padding:0 1.1rem}
.stamp.thud{animation:thud .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes thud{from{transform:scale(1.8) rotate(-24deg);opacity:0}to{transform:rotate(-14deg);opacity:1}}
@media (max-width:34rem){.award{grid-template-columns:3rem 1fr auto;gap:.2rem .7rem;padding:.9rem .3rem}.emb{font-size:1.1rem}.stamp{width:7.5rem}.stamp .s-txt{font-size:.82rem}}
.fine{margin:1.8rem 0 0;padding-top:.8rem;border-top:.06rem solid var(--rule);font-size:.82rem;color:var(--ink-soft)}
.back{margin:1.2rem 0 0;text-align:center;font-size:.9rem}
.back a{color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.stamp.thud{animation:none}.award{transition:none}}
</style>
</head>
<body>
<main class="desk">
  <article class="sheet">
    <p class="kicker label"><span>Guía del Jueves de Gloria</span><span class="red" id="no">Informe del inspector</span></p>
    <h1 id="name">Preparando la ficha…</h1>
    <p class="meta" id="meta">&nbsp;</p>
    <section class="cred" id="cred" aria-label="Credenciales"></section>
    <h2 class="label">Dictamen del inspector</h2>
    <ul class="awards" id="awards" aria-label="Distintivos"></ul>
    <div class="verdict"><p class="note" id="say" aria-live="polite"></p><div class="stamp" id="stamp" hidden></div></div>
    <p class="fine" id="rules"></p>
  </article>
  <p class="back"><a href="./">← Volver al bombo</a> · <a href="privacidad.html">Privacidad</a></p>
</main>

<script type="module">
import {parseWinners,VERDICTS,MIN_VOTES,votesToVerdicts,VOTE_API,GOOGLE_CLIENT_ID,VOTE_DOMAIN} from './rules.js';
const $=id=>document.getElementById(id);
// cada veredicto, un distintivo con la coletilla de la guía
const AWARDS=[
  {k:'repetir',emb:'★★★',line:'Cocina excepcional: merece otro jueves.'},
  {k:'aprobado',emb:'★★',line:'Muy buena cocina; merece la espera del repartidor.'},
  {k:'nifu',emb:'★',line:'Cocina correcta. Para un martes cualquiera.'},
  {k:'nuncamas',emb:'⊘',line:'El inspector desaconseja la visita.'},
];
const embOf=k=>AWARDS.find(a=>a.k===k).emb;
let token=null,mine=null,counts=null,busy=false,sorteo=null,open=null,closed=false,stamped=null;

const say=(html,cls='')=>{$('say').innerHTML=html;$('say').className='note '+cls;};
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
$('rules').innerHTML=`Un voto por persona, con tu cuenta de ${VOTE_DOMAIN}; puedes cambiarlo mientras este sea el último sorteo. `+
  `Con ${MIN_VOTES} votos o más, el dictamen pesa sobre el sitio dentro de su cocina en los próximos sorteos: `+
  AWARDS.map(a=>`${a.emb} ×${String(VERDICTS[a.k].weight).replace('.',',')}`).join(' · ')+'.';

function renderAwards(){
  const total=Object.values(counts||{}).reduce((a,n)=>a+n,0);
  $('awards').innerHTML=AWARDS.map(a=>{const n=(counts||{})[a.k]||0;return `<li><button type="button" class="award" data-k="${a.k}" aria-pressed="${mine===a.k}" ${!token||closed||busy?'disabled':''}>
    <span class="emb${a.k==='nuncamas'?' none':''}" aria-hidden="true">${a.emb}</span>
    <span class="txt"><b>${VERDICTS[a.k].label}${mine===a.k?'<span class="mine label">Tu voto</span>':''}</b><i>${a.line}</i></span>
    ${counts?`<span class="tally"><span class="n">${plural(n,'voto','votos')}</span><span class="bar" style="--p:${total?100*n/total:0}%"></span></span>`:'<span></span>'}
  </button></li>`;}).join('');
  $('awards').querySelectorAll('.award').forEach(b=>b.onclick=()=>vote(b.dataset.k));
}

// dictamen de la redacción: con votos suficientes, sello de tinta sobre la ficha
function verdictNote(){
  const total=Object.values(counts||{}).reduce((a,n)=>a+n,0);
  const v=votesToVerdicts({[sorteo]:counts||{}})[sorteo];
  const s=$('stamp');
  // con dictamen, el sello es el de la oficina; mientras no lo hay, el de tu propio voto
  const key=v?v.verdict:mine,lbl=v?(closed?'Dictamen final':'Dictamen provisional'):'Tu dictamen';
  if(key){
    s.innerHTML=`<span class="s-emb">${embOf(key)}</span><span class="s-txt">${VERDICTS[key].label}</span><span class="s-lbl label">${lbl}</span>`;
    s.hidden=false;
    if(stamped!==key+lbl){s.classList.remove('thud');void s.offsetWidth;s.classList.add('thud');stamped=key+lbl;}
  }else s.hidden=true;
  const tail=closed?' La ficha de este sorteo está cerrada.':mine?' Puedes cambiar tu voto cuando quieras.':'';
  if(!v)return `${plural(total,'voto','votos')} hasta ahora; faltan ${MIN_VOTES-total} para el dictamen.${tail}`;
  return `Dictamen ${closed?'final':'provisional'} de la redacción, con ${plural(total,'voto','votos')}: <b>${VERDICTS[v.verdict].label}</b>${/[!.]$/.test(VERDICTS[v.verdict].label)?'':'.'}${tail}`;
}

async function api(method,body){
  const r=await fetch(`${VOTE_API}/vote${method==='GET'?'?sorteo='+sorteo:''}`,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body&&JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){token=null;showLogin(j.error||'Tu acreditación ha caducado: vuelve a identificarte.');throw new Error('');}
  if(!r.ok)throw new Error(j.error||'HTTP '+r.status);
  return j;
}

async function vote(k){
  if(!token||busy||closed)return;
  busy=true;renderAwards();
  try{({mine,counts}=await api('POST',{sorteo,verdict:k}));busy=false;renderAwards();say(verdictNote());}
  catch(e){busy=false;renderAwards();if(e.message)say(`La redacción no ha podido archivar tu voto: ${e.message}`,'err');}
}

async function signedIn(credential){
  token=credential;
  const email=JSON.parse(decodeURIComponent(escape(atob(credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))))).email;
  $('cred').innerHTML=`<span class="who">Inspector acreditado: ${email}</span>`;
  say('Consultando el archivo…');
  try{({mine,counts}=await api('GET'));say(mine?verdictNote():'Elige el distintivo que merece.');}
  catch(e){if(e.message)say(`El archivo no responde: ${e.message}`,'err');}
  renderAwards();
}

function showLogin(msg){
  $('cred').innerHTML=`<p>Para dictaminar, identifícate con tu cuenta de ${VOTE_DOMAIN}.</p><div id="gsi"></div>`;
  say(msg||'',msg?'err':'');
  renderAwards();
  const go=()=>{
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:r=>signedIn(r.credential),hd:VOTE_DOMAIN,auto_select:true,context:'signin'});
    google.accounts.id.renderButton($('gsi'),{theme:'outline',shape:'rectangular',text:'signin_with',locale:'es'});
    google.accounts.id.prompt();
  };
  if(window.google&&google.accounts)return go();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=go;
  s.onerror=()=>say('No se pudo cargar el acceso de Google. ¿Un bloqueador de anuncios?','err');
  document.head.appendChild(s);
}

// arranque: qué sorteo se vota, de qué sitio, y si sigue abierto
const get=f=>fetch(f+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(new Error(f+': HTTP '+r.status)));
try{
  const [issues,data,votes]=await Promise.all([get('data/winners.json'),get('data/stores.json'),get('data/votes.json').catch(()=>({}))]);
  const winners=parseWinners(issues);
  open=(winners[0]||{}).number;
  sorteo=+new URLSearchParams(location.search).get('sorteo')||open;
  const w=winners.find(x=>x.number===sorteo);
  if(!w){$('name').textContent='Ficha no encontrada';say('La guía no tiene ningún sorteo con ese número.','err');renderAwards();}
  else{
    const row=data.rows.find(r=>r.slug===w.slug)||{name:w.slug,tags:[]};
    const day=new Date(w.date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
    $('name').textContent=row.name;
    $('no').textContent=`Informe nº ${winners.length-winners.indexOf(w)}`;
    $('meta').textContent=[...row.tags,'a domicilio en Zuatzu',`visitado el ${day}`].join(' · ');
    document.title=`Informe del inspector · ${row.name}`;
    closed=sorteo!==open;
    if(closed){counts=votes[sorteo]||null;say(counts?verdictNote():'Esta ficha se cerró sin votos.');renderAwards();}
    else if(!VOTE_API||!GOOGLE_CLIENT_ID){say('La redacción aún está preparando la guía. Vuelve pronto.');renderAwards();}
    else showLogin();
  }
}catch(e){$('name').textContent='Ficha no disponible';say(`No se pudo cargar la ficha: ${e.message}`,'err');renderAwards();}
</script>
</body>
</html>
